[project]
name = "mevratek-backend"
version = "0.1.0"
description = "Mevratek — backend API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in defaults

[tool.ruff.lint.per-file-ignores]
# Migration bodies are written by `alembic revision --autogenerate`, which
# emits one long sa.Column(...) per line. Reformatting them by hand would churn
# files that have already run against production databases for no gain, so the
# line limit is lifted here — every other rule still applies, and env.py and
# the revision template are held to the full standard.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []
