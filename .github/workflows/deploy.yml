name: CI & Deploy (Timeweb Cloud Apps)

# Runs the full check suite on every push / PR, and — on push to `main` —
# triggers a redeploy of the Timeweb Cloud Apps. Timeweb also auto-deploys on
# push via its native GitHub integration; this workflow gates the deploy behind
# green CI and makes the pipeline explicit + auditable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest

  frontend-checks:
    name: Frontend (tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  website-checks:
    name: Website (tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  deploy:
    name: Deploy to Timeweb Cloud Apps
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, website-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Timeweb redeploy
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          BACKEND_APP_ID: ${{ secrets.TIMEWEB_BACKEND_APP_ID }}
          FRONTEND_APP_ID: ${{ secrets.TIMEWEB_FRONTEND_APP_ID }}
          WEBSITE_APP_ID: ${{ secrets.TIMEWEB_WEBSITE_APP_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TIMEWEB_API_TOKEN:-}" ]; then
            echo "::notice::TIMEWEB_API_TOKEN not set — relying on Timeweb's" \
              "native auto-deploy on push to main. Skipping explicit trigger."
            exit 0
          fi

          deploy() {
            local app_id="$1" name="$2"
            if [ -z "$app_id" ]; then
              echo "::notice::${name} app id not set — skipping."
              return 0
            fi
            echo "Triggering redeploy of ${name} app (${app_id})..."
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X POST "https://api.timeweb.cloud/api/v1/apps/${app_id}/deploy" \
              -H "Authorization: Bearer ${TIMEWEB_API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "HTTP ${code}"
            cat /tmp/resp.json || true
            echo
            case "$code" in
              2*) echo "${name}: redeploy triggered." ;;
              *)  echo "::error::${name} redeploy failed (HTTP ${code})."; return 1 ;;
            esac
          }

          deploy "${BACKEND_APP_ID:-}" "backend"
          deploy "${FRONTEND_APP_ID:-}" "frontend"
          deploy "${WEBSITE_APP_ID:-}" "website"
