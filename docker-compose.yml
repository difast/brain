name: mevratek

# Minimal stack: backend (Mevratek) + Postgres. No Redis, no MinIO —
# presence is tracked in Postgres and object storage is optional. The frontend
# dashboard is included for convenience but is not required.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://brain:brain@postgres:5432/brain
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional dashboard. Remove this block if you only need the API.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
