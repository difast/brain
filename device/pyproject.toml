[project]
name = "mevratek-device"
version = "0.1.0"
description = "Агент устройства: тело, которое разговаривает с мозгом Mevratek"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Веб-камера и config.yaml нужны не всем, поэтому вынесены.
webcam = ["opencv-python>=4.9"]
config = ["PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Те же правила, что и у бэкенда: агент — такой же код, живущий у заказчика.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
