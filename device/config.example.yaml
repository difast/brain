# Скопируйте в config.yaml и заполните. Любую строку можно переопределить
# флагом при запуске или переменной окружения — файл нужен только чтобы не
# набирать одно и то же каждый раз.
#
# config.yaml в .gitignore: в нём лежит ключ.

# Куда стучаться. Локальный бэкенд или боевой.
api: http://localhost:8000/api/v1
# api: https://api.mevratek.ru/api/v1

# Ключ организации из панели: Аккаунт → Разработчику.
# Он нужен только при регистрации: платформа меняет его на токен устройства,
# поэтому на настоящем роботе этот ключ не остаётся.
api_key: ""

name: laptop-rover
task: осмотрись и двигайся, не задевая препятствия

hardware: simulated     # simulated | raspberry (появится вместе с железом)
camera: none            # none | file | webcam
# frame: ./scene.jpg    # для camera: file
# camera_index: 0       # для camera: webcam

interval: 2.0           # пауза между кругами, секунд
# rounds: 20            # сколько кругов сделать и выйти
pull_tasks: false       # брать задачи из очереди платформы
