[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudbrain-sdk"
version = "0.1.0"
description = "Python SDK for the Cloud Brain for Robots API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/difast/brain"

[tool.hatch.build.targets.wheel]
packages = ["cloudbrain"]
